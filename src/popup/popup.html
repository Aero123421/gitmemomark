<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitMemoMark - GitHub に保存</title>
  <script src="../lib/theme-init.js"></script>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span> GitMemoMark</h1>
    <span id="repo-label" class="repo-label"></span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="テーマ切替"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button>
    <button id="open-options" class="icon-btn" type="button" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <section id="setup" hidden><h2>保存先を設定しましょう</h2><p>あなたの GitHub リポジトリに、気になった情報を残せます。</p><button id="setup-btn" type="button" class="primary">設定を開く</button></section>
  <form id="form" hidden>
    <div class="popup-body">
      <div class="manuscript-zone">
        <section class="target-card" aria-label="保存するページ">
          <div class="preview"><span id="source-badge" class="badge">Web</span><a id="url" target="_blank" rel="noreferrer"></a><svg class="edit-nib" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4-12 12-5 1 1-5zM12 21h9"/></svg></div>
          <label class="title-field"><span class="visually-hidden">タイトル</span><textarea id="title" rows="2" required></textarea></label>
          <div class="capture-bar">
            <div id="content-row" class="content-row" hidden><label class="check"><input id="with-content" type="checkbox" checked /><span>本文を Markdown 保存</span><small id="content-len"></small></label></div>
            <details id="preview-box" hidden><summary>プレビュー <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="preview-sheet"><div id="excerpt-box" hidden><p class="preview-label">抜粋 / 本文</p><p id="excerpt"></p></div><pre id="content-preview" hidden></pre></div></details>
          </div>
        </section>
        <section class="marginalia" aria-label="メモ">
          <div class="marginalia-head"><label for="memo">メモ</label><span>任意</span></div>
          <div class="marginalia-well"><textarea id="memo" rows="2" placeholder="気になった理由や、あとで試すこと…"></textarea></div>
        </section>
      </div>
      <div class="colophon-tray">
        <div class="field">
          <div class="field-head"><div class="filing-title"><label for="folder">保存先フォルダ</label><span id="classification-seal" class="jev-seal" hidden></span></div><div class="filing-actions"><button id="reclassify" type="button" class="ghost" title="現在のタイトルとメモで再判定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></svg> 再判定</button><button id="new-folder-btn" type="button" class="ghost" aria-expanded="false" aria-controls="new-folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 新規</button></div></div>
          <div class="folder-row"><svg class="folder-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v11H3z"/></svg><select id="folder" aria-label="フォルダ"></select></div>
          <input id="new-folder" type="text" aria-label="新規フォルダ" placeholder="例: notes/reading（/ で階層化）" hidden />
          <p id="suggest" class="hint" aria-live="polite"></p>
        </div>
        <div class="tags-ledger"><label for="tags">タグ</label><input id="tags" type="text" placeholder="カンマ・スペース区切り" /></div>
      </div>
    </div>
    <footer class="save-footer"><div class="footer-actions"><span class="shortcut-caption"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd></span><button id="save" type="submit" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg> GitHub に保存</button></div><p id="status" class="status" aria-live="polite"></p></footer>
  </form>
  <script type="module" src="popup.js"></script>
</body>
</html>
