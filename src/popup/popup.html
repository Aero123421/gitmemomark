<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitMemoMark - GitHub に保存</title>
  <script src="../lib/theme-init.js"></script>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 21V4h12v17l-6-4z"/><circle cx="12" cy="9" r="1.5"/></svg></span> GitMemoMark</h1>
    <span id="repo-label" class="repo-label"></span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="テーマ切替"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button>
    <button id="open-options" class="icon-btn" type="button" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <section id="setup" hidden><h2>保存先を設定しましょう</h2><p>あなたの GitHub リポジトリに、気になった情報を残せます。</p><button id="setup-btn" type="button" class="primary">設定を開く</button></section>
  <form id="form" hidden>
    <div class="popup-body">
      <section class="target-card" aria-label="保存するページ">
        <div class="preview"><span id="source-badge" class="badge">Web</span><a id="url" target="_blank" rel="noreferrer"></a></div>
        <label class="field title-field"><span>タイトル</span><input id="title" type="text" required /></label>
        <div id="content-row" class="content-row" hidden><label class="check"><input id="with-content" type="checkbox" checked />本文を Markdown 保存 <small id="content-len"></small></label></div>
        <details id="preview-box" hidden><summary>プレビュー</summary><div id="excerpt-box" hidden><p class="preview-label">抜粋 / 本文</p><p id="excerpt"></p></div><pre id="content-preview" hidden></pre></details>
      </section>
      <div class="field">
        <div class="field-head"><label for="folder">フォルダ</label><button id="reclassify" type="button" class="ghost" title="現在のタイトルとメモで再判定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/></svg> 再判定</button></div>
        <div class="folder-row"><select id="folder" aria-label="フォルダ"></select><button id="new-folder-btn" type="button" class="secondary" aria-expanded="false" aria-controls="new-folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 新規</button></div>
        <input id="new-folder" type="text" aria-label="新規フォルダ" placeholder="例: tech/react（/ で入れ子にできます）" hidden />
        <p id="suggest" class="hint" aria-live="polite"></p>
      </div>
      <label class="field"><span>メモ</span><textarea id="memo" rows="2" placeholder="気になった理由や、あとで試すこと…"></textarea></label>
      <label class="field"><span>タグ <small>カンマ・スペース区切り</small></span><input id="tags" type="text" placeholder="react, frontend" /></label>
    </div>
    <footer class="save-footer"><button id="save" type="submit" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4h12v17l-6-4z"/></svg> GitHub に保存 <small>Ctrl / ⌘ + Enter</small></button><p id="status" class="status" aria-live="polite"></p></footer>
  </form>
  <script type="module" src="popup.js"></script>
</body>
</html>
